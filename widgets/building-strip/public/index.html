<html>
  <head>
    <style>
      body { color: var(--homey-text-color); }

      .stack { display: flex; flex-direction: column; gap: var(--homey-su-4); }

      .top { display: flex; align-items: flex-start; gap: var(--homey-su-4); }
      .top .left { flex: 1 1 auto; min-width: 0; }

      .big {
        font-size: var(--homey-font-size-xxlarge);
        line-height: var(--homey-line-height-xxlarge);
        font-weight: var(--homey-font-weight-bold);
      }

      .wind { flex: 0 0 auto; display: flex; align-items: center; gap: var(--homey-su-2); }
      .rose {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--homey-color-mono-100);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .clouds { display: flex; align-items: center; gap: var(--homey-su-3); }
      .clouds .label { flex: 0 0 auto; }
      .track {
        flex: 1 1 auto;
        height: 4px;
        border-radius: 2px;
        background: var(--homey-line-color);
        overflow: hidden;
      }
      .fill { height: 100%; border-radius: 2px; background: var(--homey-color-mono-400); }

      .gateway {
        display: flex;
        align-items: center;
        gap: var(--homey-su-2);
        padding-top: var(--homey-su-3);
        border-top: 1px solid var(--homey-line-color);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--homey-color-green); }
      .gateway.down .dot { background: var(--homey-color-red); }
      .spacer { margin-left: auto; }

      .message { display: flex; align-items: center; min-height: 36px; }
    </style>
  </head>

  <body class="homey-widget">
    <div id="root"></div>

    <script type="text/javascript">
      function onHomeyReady(Homey) {
        var settings = Homey.getSettings();
        var root = document.getElementById('root');

        // Ask for exactly what was drawn. Counting rows by hand drifts the
        // moment the styling changes, and a frame shorter than its content
        // clips silently.
        function measure() {
          var style = window.getComputedStyle(document.body);
          return Math.ceil(root.getBoundingClientRect().height
            + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom));
        }

        function chosenBuilding(state) {
          var wanted = settings.building && settings.building.buildingId;
          if (wanted) {
            var match = state.buildings.filter(function (b) { return b.buildingId === wanted; });
            if (match.length > 0) return match[0];
            return null;
          }
          // Most accounts have exactly one building, so an unset setting is not
          // a reason to show nothing.
          return state.buildings.length > 0 ? state.buildings[0] : null;
        }

        function number(value, digits, unit) {
          if (value === null) return '–';
          return value.toFixed(digits).replace('.', ',') + unit;
        }

        function compass(angle) {
          if (angle === null) return '';
          var points = Homey.__('widgets.building.compass').split(',');
          return points[Math.round((angle % 360) / 22.5) % 16];
        }

        function clockTime(iso) {
          if (!iso) return null;
          var when = new Date(iso);
          if (isNaN(when.getTime())) return null;
          return when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function message(text) {
          root.replaceChildren();
          var p = document.createElement('div');
          p.className = 'message homey-text-small-light';
          p.textContent = text;
          root.append(p);
        }

        function element(tag, className, text) {
          var el = document.createElement(tag);
          if (className) el.className = className;
          if (text !== undefined) el.textContent = text;
          return el;
        }

        function draw(building) {
          var stack = element('div', 'stack');

          var top = element('div', 'top');
          var left = element('div', 'left');
          left.append(
            element('div', 'big', number(building.outdoorTemperature, 1, '°')),
            element('div', 'homey-text-small-light', Homey.__('widgets.building.outdoor'))
          );

          var wind = element('div', 'wind');
          var rose = element('span', 'rose');
          rose.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"'
            + ' stroke="var(--homey-color-blue)" stroke-width="2.2" stroke-linecap="round"'
            + ' stroke-linejoin="round"><path d="M12 20V5"/><path d="M6 11l6-6 6 6"/></svg>';
          if (building.windAngle !== null) {
            rose.firstChild.style.transform = 'rotate(' + building.windAngle + 'deg)';
          }
          var windText = element('div');
          windText.append(
            element('div', 'homey-text-medium', number(building.windStrength, 1, ' m/s')),
            element('div', 'homey-text-small-light', compass(building.windAngle))
          );
          wind.append(rose, windText);

          top.append(left, wind);
          stack.append(top);

          if (building.cloudCoverage !== null) {
            var clouds = element('div', 'clouds');
            var track = element('div', 'track');
            var fill = element('div', 'fill');
            fill.style.width = Math.max(0, Math.min(100, building.cloudCoverage)) + '%';
            track.append(fill);
            clouds.append(
              element('span', 'label homey-text-small-light', Homey.__('widgets.building.clouds')),
              track,
              element('span', 'homey-text-small', Math.round(building.cloudCoverage) + ' %')
            );
            stack.append(clouds);
          }

          var gateway = element('div', 'gateway' + (building.online ? '' : ' down'));
          gateway.append(
            element('span', 'dot'),
            element('span', 'homey-text-small', Homey.__(building.online
              ? 'widgets.building.online'
              : 'widgets.building.offline'))
          );
          var seen = clockTime(building.lastSeen);
          if (seen !== null) {
            gateway.append(element('span', 'spacer homey-text-small-light',
              Homey.__('widgets.building.lastSeen', { time: seen })));
          }
          stack.append(gateway);

          root.replaceChildren(stack);
        }

        function render(state) {
          if (!state.hasKey) {
            message(Homey.__('widgets.common.noKey'));
          } else {
            var building = chosenBuilding(state);
            if (building === null) {
              message(Homey.__('widgets.common.pickBuilding'));
            } else {
              draw(building);
            }
          }

          var height = measure();
          Homey.setHeight(height);
          return height;
        }

        Homey.on('state', render);

        Homey.api('GET', '/', {})
          .then(function (state) {
            Homey.ready({ height: render(state) });
          })
          .catch(function (err) {
            console.error(err);
            Homey.ready({ height: message(Homey.__('widgets.common.failed')) });
          });
      }
    </script>
  </body>
</html>
