name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types first: the API is full of nullable fields, and strict mode is what
      # keeps them from turning into runtime surprises.
      - name: Typecheck
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: node --test ".homeybuild/test/**/*.test.js"

      # Drift here only shows up at release time otherwise, when the tag is
      # already pushed and the release notes are already wrong.
      - name: Check the version is consistent
        run: node scripts/check-version.mjs

      # Catches missing translations, wrong image sizes and unknown capabilities.
      - name: Validate Homey app
        uses: athombv/github-action-homey-app-validate@master
        with:
          level: publish
