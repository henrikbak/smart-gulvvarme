name: Release

# A tag is the trigger, so the version that reaches GitHub is the version that
# was tagged - no separate button to press and forget.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Everything the release does - build, lint, test, Homey validate, version
      # check, release notes, GitHub release - lives in this one command, and it
      # runs the same way from a laptop.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release
