name: Release

# A tag is the trigger, so the version that reaches GitHub is the version that
# was tagged - no separate button to press and forget.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag can be placed on any commit, so the tagged tree is checked again
      # rather than trusting the run that happened on push.
      - name: Typecheck
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: node --test ".homeybuild/test/**/*.test.js"

      - name: Validate Homey app
        uses: athombv/github-action-homey-app-validate@master
        with:
          level: publish

      # Stops a release that would name a different version than the app the
      # store publishes, and catches a tag with no changelog behind it.
      - name: Check the tag against app.json and the changelog
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}"

      - name: Write the release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md

      # Re-runnable: an existing release for the tag is updated in place.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
