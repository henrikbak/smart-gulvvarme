<style>
  .field { margin: 0 0 12px; }
  .field label { display: block; margin-bottom: 6px; font-weight: 600; }
  .field input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-family: inherit;
    font-size: 15px;
  }
  .error { color: #d1344c; margin: 0 0 12px; min-height: 1.2em; }
  .hint { opacity: 0.7; font-size: 13px; margin: 0 0 20px; }
  /* Hidden until we know this view is not being skipped, so a user who already
     has a working key never sees the form flash past. The script reveals it on
     every path that stays here, plus a failsafe timer - never a blank screen. */
  #form { visibility: hidden; }
</style>

<div id="form">
  <header class="homey-header">
    <h1 class="homey-title" data-i18n="pair.title"></h1>
    <p class="homey-subtitle" data-i18n="pair.subtitle"></p>
  </header>

  <fieldset class="field">
    <label for="apiKey" data-i18n="pair.keyLabel"></label>
    <!-- password, so the key is not shoulder-readable while typing -->
    <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sgv_live_..." />
  </fieldset>

  <p class="error" id="error"></p>
  <p class="hint" data-i18n="pair.hint"></p>

  <button id="submit" class="homey-button-primary-full" data-i18n="pair.submit"></button>
</div>

<script type="text/javascript">
  var form = document.getElementById('form');
  var input = document.getElementById('apiKey');
  var submit = document.getElementById('submit');
  var errorEl = document.getElementById('error');

  var mode = 'pair';
  var busy = false;

  // Reveal the form and focus it. Called on every path that stays on this view.
  function showForm() {
    form.style.visibility = 'visible';
    input.focus();
  }

  // Failsafe: if the driver round-trip below never calls back, show the form
  // anyway rather than leaving the user staring at nothing.
  var failsafe = setTimeout(showForm, 4000);

  function showError(message) {
    clearTimeout(failsafe);
    showForm();
    errorEl.textContent = message || '';
  }

  function setBusy(value) {
    busy = value;
    submit.disabled = value;
    input.disabled = value;
  }

  /**
   * Talk to the driver.
   *
   * This pairing frontend is callback-style: Homey.ready() and Homey.emit()
   * return undefined, not a promise, so `Homey.ready().then(...)` throws and
   * kills the whole view before it can navigate. Other builds return a thenable.
   * This helper copes with either shape and always calls back exactly once.
   */
  function call(event, data, cb) {
    var settled = false;
    function done(err, result) {
      if (settled) return;
      settled = true;
      cb(err, result);
    }

    var ret;
    try {
      ret = Homey.emit(event, data, function (err, result) { done(err, result); });
    } catch (err) {
      done(err);
      return;
    }

    if (ret && typeof ret.then === 'function') {
      ret.then(function (result) { done(null, result); }, function (err) { done(err); });
    }
  }

  // Pairing continues to the device list; repair has nowhere to go, so it closes.
  function finish() {
    if (mode === 'repair') {
      Homey.done();
    } else {
      Homey.showView('list_devices');
    }
  }

  function save() {
    if (busy) return;
    showError('');
    setBusy(true);

    call('validate_key', input.value, function (err, result) {
      setBusy(false);
      if (err) {
        showError(err && err.message ? err.message : String(err));
        return;
      }
      if (result && result.ok) {
        finish();
        return;
      }
      showError((result && result.error) || 'Unknown error');
    });
  }

  submit.addEventListener('click', save);
  input.addEventListener('keydown', function (event) {
    if (event.key === 'Enter') save();
  });

  // Signal the view is ready; the return value is not a promise here.
  try { Homey.ready(); } catch (err) {}

  call('pair_mode', null, function (err, resolvedMode) {
    if (!err && resolvedMode) mode = resolvedMode;

    if (mode !== 'pair') {
      clearTimeout(failsafe);
      showForm();
      return;
    }

    // A key that already works should not be re-typed just to add another room.
    call('has_key', null, function (keyErr, hasKey) {
      clearTimeout(failsafe);
      if (!keyErr && hasKey) {
        Homey.showView('list_devices');
        return;
      }
      showForm();
    });
  });
</script>
